<!doctype html><html lang="en"><head><meta charset="utf-8"><title>FormTest Pro - Hospital Form</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial;background:#f4f6fb;margin:0;padding:40px}main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:14px;box-shadow:0 8px 30px #15213a18}label{display:block;margin:14px 0 6px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd3e1;border-radius:7px}button{margin-top:20px;padding:12px 20px;background:#5b4bdb;color:white;border:0;border-radius:7px}h1{color:#26264b}</style></head><body><main><h1>Hospital Application Form</h1><p>Internal demonstration form for FormTest Pro automated testing.</p><form id="application-form"><label for="fullName">Full Name</label><input id="fullName" name="fullName" type="text" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="phone">Phone</label><input id="phone" name="phone" type="tel"><label for="category">Category</label><select id="category" name="category"><option value="">Choose</option><option value="general">General</option><option value="other">Other</option></select><label for="details">Details</label><textarea id="details" name="details"></textarea><label><input id="consent" type="checkbox" style="width:auto"> I confirm the information</label><button id="submitBtn" type="submit">Submit Application</button><p id="result" aria-live="polite"></p></form></main><script>document.getElementById('application-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('result').textContent='Form submitted successfully';});</script></body></html>
